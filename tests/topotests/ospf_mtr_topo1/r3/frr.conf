hostname r3
!
interface lo
 ip address 3.3.3.3/32
 ip ospf area 0
!
interface r3-eth0
 ip address 10.0.13.3/24
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf mt-id 10 cost 10
!
interface r3-eth1
 ip address 10.0.34.3/24
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf mt-id 10 cost 10
!
interface r3-eth2
 ip address 10.0.35.3/24
 ip ospf area 1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
 ip ospf mt-id 10 cost 7
!
router ospf
 ospf router-id 3.3.3.3
 mtr copy-base-topology
 mtr route-table-offset 255
!
