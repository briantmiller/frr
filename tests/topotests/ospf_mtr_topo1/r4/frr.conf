hostname r4
!
! Legacy router: no multi-topology configuration.
ip route 192.168.4.0/24 blackhole
!
interface lo
 ip address 4.4.4.4/32
 ip ospf area 0
!
interface r4-eth0
 ip address 10.0.24.4/24
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
interface r4-eth1
 ip address 10.0.34.4/24
 ip ospf area 0
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
router ospf
 ospf router-id 4.4.4.4
 redistribute static
!
