hostname r5
!
! Legacy router: no multi-topology configuration.
interface lo
 ip address 5.5.5.5/32
 ip ospf area 1
!
interface r5-eth0
 ip address 10.0.35.5/24
 ip ospf area 1
 ip ospf network point-to-point
 ip ospf hello-interval 1
 ip ospf dead-interval 4
!
router ospf
 ospf router-id 5.5.5.5
!
