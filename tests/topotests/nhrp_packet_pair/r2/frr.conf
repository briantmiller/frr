frr defaults traditional
hostname r2
log stdout debugging
ip forwarding
!
nhrp nflog-group 1
!
interface r2-eth0
 ip address 10.2.1.2/24
exit
!
interface r2-eth1
 ip address 192.168.2.2/24
exit
!
interface r2-gre0
 ip address 10.255.255.2/32
 no link-detect
 ipv6 nd suppress-ra
 ip nhrp authentication secret
 ip nhrp holdtime 10
 ip nhrp redirect
 ip nhrp network-id 42
 ip nhrp registration no-unique
 ip nhrp packet-pair interval 2 probes 4
 tunnel source r2-eth0
exit
!
ip route 10.1.1.0/24 10.2.1.3
ip route 192.168.1.0/24 10.255.255.1
ip route 192.168.4.0/24 10.255.255.4
!
end
