!debug zebra tc
!
! Source addresses used by the test traffic generator
interface lo
 ip address 10.3.3.3/32
 ip address 10.1.1.1/32
 ip address 172.16.0.1/32
 ipv6 address 2001:db8:99::1/128
exit
!
interface r1-eth0
 ip address 192.0.2.1/24
 ipv6 address 2001:db8:1::1/64
 qos bandwidth 20mbps
 service-policy output PARENT
exit
!
! VOICE: everything from 10/8 except 10.1.1.0/24, plus 2001:db8:99::/48
access-list VOICE seq 5 deny 10.1.1.0/24
access-list VOICE seq 10 permit 10.0.0.0/8
ipv6 access-list VOICE seq 5 permit 2001:db8:99::/48
!
! MGMT: Cisco style wildcard source match
access-list MGMT seq 5 permit ip 172.16.0.0 0.0.0.255 any
!
! WEB: Cisco style extended entry matching a destination host
access-list WEB seq 5 permit ip any host 192.0.2.80
!
class-map match-any VOICE
 match access-group name VOICE
 match ip dscp ef
exit
!
class-map match-all MGMT
 match access-group name MGMT
 match ip dscp cs6
exit
!
class-map match-all WEB
 match access-group name WEB
exit
!
class-map match-all BULK
 match ip dscp cs1
exit
!
policy-map CHILD
 class BULK
  bandwidth percent 30
  queue-limit 200 packets
 exit
 class class-default
  bandwidth percent 70
 exit
exit
!
policy-map PARENT
 class VOICE
  bandwidth 5mbps
  max-bandwidth percent 50
  priority 0
  queue-limit 64 packets
 exit
 class MGMT
  bandwidth percent 5
  priority 1
 exit
 class WEB
  bandwidth percent 20
  priority 2
  service-policy CHILD
 exit
 class class-default
  bandwidth percent 10
  max-bandwidth 15mbps
 exit
exit
!
! HFSC policies, applied by test_qos_hfsc
policy-map HCHILD hfsc
 class BULK
  ls m2 percent 5
  ul m2 8mbps
  queue-limit 200 packets
 exit
exit
!
policy-map HPARENT hfsc
 class VOICE
  rt m1 4mbps d 10ms m2 2mbps
  ls m2 percent 20
  queue-limit 64 packets
 exit
 class WEB
  sc m2 percent 40
  ul m2 percent 75
  service-policy HCHILD
 exit
 class class-default
  ls m1 percent 30 d 20ms m2 1500kbps
 exit
exit
!
