hostname r1
!
interface lo
 ip address 10.255.0.1/32
exit
!
interface r1-r2
 ip address 10.0.12.1/30
 sand
 sand hello-interval 1
 sand hold-time 4
exit
!
interface r1-r3
 ip address 10.0.13.1/30
 sand
 sand hello-interval 1
 sand hold-time 4
exit
!
interface r1-r5
 ip address 10.0.51.2/30
 sand
 sand hello-interval 1
 sand hold-time 4
exit
!
router sand
 router-id 10.255.0.1
 network 10.255.0.1/32
 network 2001:db8:ff::1/128
 summary-interval 5
exit
!
