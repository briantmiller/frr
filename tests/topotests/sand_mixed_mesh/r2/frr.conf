hostname r2
!
interface lo
 ip address 10.255.0.2/32
exit
!
interface r2-r1
 ip address 10.0.12.2/30
 sand
 sand hello-interval 1
 sand hold-time 4
exit
!
interface r2-r4
 ip address 10.0.24.1/30
 sand
 sand hello-interval 1
 sand hold-time 4
exit
!
router sand
 router-id 10.255.0.2
 network 10.255.0.2/32
 network 2001:db8:ff::2/128
 summary-interval 5
exit
!
