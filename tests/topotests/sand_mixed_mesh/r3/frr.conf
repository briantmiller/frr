hostname r3
!
interface lo
 ip address 10.255.0.3/32
exit
!
interface r3-r1
 ip address 10.0.13.2/30
 sand
 sand hello-interval 1
 sand hold-time 4
exit
!
interface r3-r4
 ip address 10.0.34.1/30
 sand
 sand hello-interval 1
 sand hold-time 4
exit
!
router sand
 router-id 10.255.0.3
 network 10.255.0.3/32
 network 2001:db8:ff::3/128
 summary-interval 5
exit
!
