hostname r5
!
interface lo
 ip address 10.255.0.5/32
exit
!
interface r5-r4
 ip address 10.0.45.2/30
 sand
 sand hello-interval 1
 sand hold-time 4
exit
!
interface r5-r1
 ip address 10.0.51.1/30
 sand
 sand cost 20
 sand hello-interval 1
 sand hold-time 4
exit
!
router sand
 router-id 10.255.0.5
 network 10.255.0.5/32
 network 2001:db8:ff::5/128
 summary-interval 5
exit
!
