hostname r4
!
interface lo
 ip address 10.255.0.4/32
exit
!
interface r4-r2
 ip address 10.0.24.2/30
 sand
 sand hello-interval 1
 sand hold-time 4
exit
!
interface r4-r3
 ip address 10.0.34.2/30
 sand
 sand hello-interval 1
 sand hold-time 4
exit
!
interface r4-r5
 ip address 10.0.45.1/30
 sand
 sand hello-interval 1
 sand hold-time 4
exit
!
router sand
 router-id 10.255.0.4
 network 10.255.0.4/32
 network 2001:db8:ff::4/128
 summary-interval 5
exit
!
